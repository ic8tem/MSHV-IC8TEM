name: Publish wiki

# Copies the pages of the wiki/ folder to the GitHub wiki of this repository.
# GitHub creates the wiki only after its first page is saved from the web page
# (Wiki tab -> "Create the first page" -> Save). After that, every change to
# wiki/ on main is published automatically.
on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wikirepo; then
            echo "::error::The wiki does not exist yet: open the Wiki tab, press 'Create the first page', save, then run this workflow again."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ wikirepo/
          cd wikirepo
          git config user.name "IC8TEM"
          git config user.email "ic8tem@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git commit -q -m "Wiki from ${GITHUB_SHA::7}"
          git push -q origin HEAD
          echo "Wiki published"
